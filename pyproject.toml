[project]
name = "paint-by-numbers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.5.0",
    "dash-mantine-components>=2.8.1,<3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "scikit-learn>=1.9.1",
    "waitress>=3.0.2",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Dash ships a pytest plugin for browser testing, which is not used here. The tests run in parallel, on up to 8
# workers: more slows them down, each worker running its own Chrome. Add -n 0 to run them in a single process
addopts = "-p no:dash -n auto --maxprocesses 8"
